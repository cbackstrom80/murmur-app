name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build core + run tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev -j

      - name: Test
        run: ctest --preset dev --output-on-failure

      - name: DSP quality measurement (non-blocking)
        continue-on-error: true
        run: |
          python3 scripts/measure_dsp_quality.py --patch content/presets/init-saw.pw8 || true
          python3 scripts/measure_dsp_quality.py --patch content/presets/fm-bell.pw8 || true

      - name: Fuzz render (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: ./build/dev/tools/pw8-fuzz-render --count 500 --seed 42 --duration 0.5

      - name: MVP content + MCP smoke
        run: |
          python3 scripts/validate_content_refs.py
          python3 mcp_server/smoke_test.py

  build-and-test-windows:
    name: Build core + run tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev -j --config Debug

      - name: Test
        run: ctest --preset dev --output-on-failure -C Debug

  sanitizers:
    name: ASan / UBSan (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (ASan)
        run: cmake --preset asan

      - name: Build (ASan)
        run: cmake --build --preset asan -j

      - name: Test (ASan)
        run: ctest --preset asan --output-on-failure

      - name: Configure (UBSan)
        run: cmake --preset ubsan

      - name: Build (UBSan)
        run: cmake --build --preset ubsan -j

      - name: Test (UBSan)
        run: ctest --preset ubsan --output-on-failure

  plugin:
    name: Plugin build + auval (macos-latest)
    runs-on: macos-latest
    # JUCE FetchContent + full plugin compile is slow; keep this isolated from the
    # required build-and-test jobs so a plugin regression doesn't block core changes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset plugin

      - name: Build
        run: cmake --build --preset plugin -j

      - name: Validate AU with auval
        run: |
          set -e
          COMPONENT="build/plugin/plugin/pw8_plugin_artefacts/Debug/AU/MURMUR.component"
          cp -R "$COMPONENT" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Murm Murr

      - name: Install pluginval
        run: brew install --cask pluginval

      # `brew install --cask pluginval` only places pluginval.app under /Applications
      # -- the cask has no `binary` stanza symlinking a CLI onto PATH (verified against
      # the cask's own artifact list), so a bare `pluginval` call fails with "command
      # not found". Invoke the app bundle's real executable directly instead, same
      # fix the Pamplejuce reference JUCE CI template uses for this exact cask.
      - name: Validate VST3 + AU with pluginval (strictness 5)
        run: |
          set -e
          PLUGINVAL="/Applications/pluginval.app/Contents/MacOS/pluginval"
          VST3="build/plugin/plugin/pw8_plugin_artefacts/Debug/VST3/MURMUR.vst3"
          # AU validation here relies on the AU bundle already being registered with
          # the system -- the preceding "Validate AU with auval" step above does that
          # (copies the .component into ~/Library/Audio/Plug-Ins/Components/ and
          # force-rescans via `killall AudioComponentRegistrar`). If these steps are
          # ever reordered or the auval step is skipped, this AU validation will start
          # failing for that reason, not a real plugin regression.
          AU="build/plugin/plugin/pw8_plugin_artefacts/Debug/AU/MURMUR.component"
          "$PLUGINVAL" --strictness-level 5 --validate "$VST3"
          "$PLUGINVAL" --strictness-level 5 --validate "$AU"

  # VST3/Standalone-only: AU is Apple-only (JUCE skips it outside FORMATS on this
  # platform), and auval/pluginval aren't part of this job -- this is purely a
  # cross-platform compile check, see docs/NEXT_STEPS.md "P0".
  plugin-windows:
    name: Plugin build (windows-latest)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset plugin

      - name: Build
        run: cmake --build --preset plugin -j --config Debug

  python-bindings:
    name: Python bindings build + smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake --preset python

      - name: Build
        run: cmake --build --preset python -j

      - name: Smoke test
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'build/python/python')
          import patchwork_eight as pw8
          patch = pw8.Patch.load('content/presets/init-saw.pw8')
          result = pw8.render(patch, 'content/test_midi/single-note.mid')
          assert result['metrics']['contains_nan_or_inf'] is False
          assert result['metrics']['peak'] > 0.0
          print('OK', result['metrics'])
          "
