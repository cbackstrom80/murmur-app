name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.4.3)"
        required: true
        default: "1.4.3"

permissions:
  contents: write

jobs:
  macos-arm64-pkg:
    name: Build MURMUR Cadillac release (Ben)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release notes path
        id: notes
        run: |
          VER="${{ steps.ver.outputs.version }}"
          BASE="${VER%%-*}"
          for f in "docs/RELEASE_${VER}.md" "docs/RELEASE_${BASE}.md"; do
            if [[ -f "$f" ]]; then
              echo "path=$f" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "path=docs/RELEASE_1.4.3.md" >> "$GITHUB_OUTPUT"

      - name: Cadillac release gate (build + auval + package)
        run: |
          chmod +x scripts/release_gate.sh scripts/build_release_pkg.sh scripts/install_au_local.sh
          scripts/release_gate.sh --skip-tests --skip-pluginval "${{ steps.ver.outputs.version }}"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MURMUR-*-macOS-arm64*.pkg
            dist/MURMUR-*-macOS-arm64*.dmg
            dist/version.json
            dist/SHA256SUMS.txt
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MURMUR-macos-arm64-${{ steps.ver.outputs.version }}
          path: |
            dist/MURMUR-*-macOS-arm64*.pkg
            dist/MURMUR-*-macOS-arm64*.dmg
            dist/version.json
            dist/SHA256SUMS.txt
